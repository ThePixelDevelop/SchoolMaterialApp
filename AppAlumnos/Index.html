<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="style.css">
  <script src="app.js" defer></script>
  <title>Materiales del Curso</title>
</head>
<body>
  <main class="contenedor">
    <header>
      <h1>Materiales del Curso</h1>
      <p class="subtitulo">Descarga directa de documentos y guías compartidas en clase.</p>
    </header>

    <input
      type="search"
      id="buscador"
      class="buscador"
      placeholder="Buscar archivo por nombre o tema..."
      aria-label="Buscar archivo"
    />

    <section id="lista-archivos" class="lista" aria-live="polite"></section>
  </main>

</body>
</html>
